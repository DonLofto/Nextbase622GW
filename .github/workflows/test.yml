name: Test recovery kit
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  shell-and-release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Upstream releases: github.com/actions/checkout/releases and actions/setup-python/releases
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/build_release.py --check
      - run: python tools/build_release.py

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Test Windows PowerShell 5.1 installer
        shell: powershell
        run: .\tests\test_windows_installer.ps1
      - name: Test shared guided repair and native Windows host
        shell: powershell
        run: |
          foreach ($Pattern in @('test_persistent_results.py', 'test_persistent_repair.py', 'test_windows_guided.py', 'test_advanced_assets.py', 'test_release.py')) {
            python -m unittest discover -s tests -p $Pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python tools/build_release.py --check
      - run: python tools/build_release.py
      - name: Build portable Windows EXE
        run: |
          python -m pip install --require-hashes -r tools/windows-build-requirements.txt
          python tools/build_windows.py
      - name: Test extracted EXE without installed Python on PATH
        shell: powershell
        run: |
          Expand-Archive -LiteralPath dist/Nextbase622GW-Windows-0.7.0.zip -DestinationPath dist/frozen-smoke
          $env:NB_REPAIR_EXE = (Resolve-Path dist/frozen-smoke/Nextbase622GW-recovery-0.7.0/Nextbase622GW-Repair.exe).Path
          python -m unittest discover -s tests -p test_windows_bundle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # github.com/actions/upload-artifact/releases/tag/v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable
          path: |
            dist/Nextbase622GW-Windows-0.7.0.zip
            dist/windows-build.json
          if-no-files-found: error

  mac-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Build standalone Mac app
        run: |
          python -m pip install --require-hashes -r tools/macos-build-requirements.txt
          python tools/build_macos.py
      - name: Test extracted app without installed Python on PATH
        run: |
          /usr/bin/ditto -x -k "dist/Nextbase622GW-Mac-${{ matrix.architecture }}-0.7.0.zip" dist/frozen-smoke
          export NB_REPAIR_APP="$PWD/dist/frozen-smoke/Nextbase622GW-recovery-0.7.0/Repair Bluetooth.app"
          python -m unittest discover -s tests -p test_macos_bundle.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-${{ matrix.architecture }}
          path: |
            dist/Nextbase622GW-Mac-${{ matrix.architecture }}-0.7.0.zip
            dist/mac-${{ matrix.architecture }}-build.json
          if-no-files-found: error
